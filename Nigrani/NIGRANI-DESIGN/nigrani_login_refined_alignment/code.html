<body class="bg-background min-h-screen flex items-center justify-center p-6 antialiased selection:bg-primary-fixed selection:text-on-primary-fixed font-body-md text-on-surface">
<main class="w-full max-w-md bg-accent-subtle rounded-[14px] p-8 flex flex-col items-center">
<header class="text-center w-full mb-10 flex flex-col items-center">
<h1 class="font-display-bold text-display-bold text-primary mb-3">NIGRANI</h1>
<div class="h-[4px] w-[60px] bg-primary rounded-full mb-5"></div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Internal Monitoring Console</p>
</header>
<form action="#" class="w-full flex flex-col gap-6" method="POST">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface normal-case font-medium" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline-variant" style="font-size: 18px;">mail</span>
<input class="w-full h-12 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-full text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="email" name="email" placeholder="officer@gov.in" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface normal-case font-medium" for="password">Password</label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline-variant" style="font-size: 18px;">lock</span>
<input class="w-full h-12 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-full text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="mt-6 w-full h-12 bg-primary text-on-primary rounded-full font-body-md text-body-md font-medium flex items-center justify-center gap-2 hover:-translate-y-0.5 shadow-btn-primary transition-all duration-200 ease-out" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined" style="font-size: 18px; font-variation-settings: 'wght' 600;">arrow_forward</span>
</button>
</form>
<footer class="mt-8 text-center w-full">
<p class="font-body-md text-sm text-outline">
                Secured Institutional Access Only
            </p>
</footer>
